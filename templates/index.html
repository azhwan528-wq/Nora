<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربات ساز پارس</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d1117; color: #c9d1d9; font-family: Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        h1 { color: #00b4d8; margin-bottom: 20px; font-size: 32px; }
        p { font-size: 16px; line-height: 1.6; margin-bottom: 40px; color: #8b949e; }
        .btn { background: linear-gradient(90deg, #00b4d8, #0077b6); color: white; padding: 18px 60px; border-radius: 30px; text-decoration: none; font-size: 18px; font-weight: bold; border: none; cursor: pointer; display: inline-block; width: 100%; max-width: 300px; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>
    <h1>🤖 ربات ساز پارس</h1>
    <p>سیستم مدیریت هوشمند ربات‌های روبیکا<br>بدون نیاز به کدنویسی، ربات خودت رو بساز!</p>
    <a href="/login" class="btn">ورود به پنل مدیریت</a>
</body>
</html>
